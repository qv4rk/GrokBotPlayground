name: Decode chapter binaries
on:
  push:
    paths:
      - '**/*.b64'
      - '**/*.b64.*'
      - 'chapter-06/build_pptx.py'
      - '.github/workflows/decode-chapter-binaries.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reassemble chunked .b64.NN and decode all .b64
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import re, base64
          root = Path('.')
          chunks = {}
          for p in root.rglob('*.b64.*'):
              m = re.match(r'^(.*\.b64)\.(\d+)$', p.name)
              if not m: continue
              key = str(p.parent / m.group(1))
              chunks.setdefault(key, []).append((int(m.group(2)), p))
          for key, parts in chunks.items():
              parts.sort()
              data = ''.join(p.read_text() for _, p in parts)
              Path(key).write_text(data)
              for _, p in parts:
                  p.unlink()
              print('reassembled', key, len(data))
          for p in list(root.rglob('*.b64')):
              out = Path(str(p)[:-4])
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(base64.b64decode(p.read_text()))
              p.unlink()
              print('decoded', out, out.stat().st_size)
          PY
      - name: Synthesize missing panels if needed
        run: |
          pip install -q pillow
          python3 << 'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          panels = [
            ("01-ibrahim-nizam.jpg", "Ibrahim / nizam"),
            ("02-jerusalem-summons.jpg", "Jerusalem summons"),
            ("03-self-mutilation.jpg", "Avoiding the draft"),
            ("04-dung-gate.jpg", "Dung Gate"),
            ("05-safed-looting.jpg", "Safed 1834"),
            ("06-ein-al-zeitun.jpg", "Ein al-Zeitun"),
            ("07-hebron-sack.jpg", "Hebron sack"),
            ("08-earthquake-safed.jpg", "Earthquake 1837"),
          ]
          root = Path('chapter-06/panels')
          root.mkdir(parents=True, exist_ok=True)
          paper, ink, ochre, soot = (237,228,212), (42,34,24), (107,58,42), (60,50,40)
          for name, label in panels:
              path = root / name
              if path.exists() and path.stat().st_size > 1000:
                  print('keep', path); continue
              im = Image.new('RGB', (1728, 1152), paper)
              d = ImageDraw.Draw(im)
              d.rectangle([40,40,1688,1112], outline=ink, width=4)
              d.rectangle([80,80,1648,1072], outline=soot, width=2)
              d.rectangle([80,80,1648,280], fill=(210,180,140))
              d.text((100,120), "THE LEDGER AND THE MOB", fill=ink)
              d.text((100,180), label, fill=ochre)
              im.save(path, 'JPEG', quality=85)
              print('synth', path)
          PY
      - name: Build chapter-06 pptx if panels present
        run: |
          if [[ -f chapter-06/panels/01-ibrahim-nizam.jpg && -f chapter-06/build_pptx.py ]]; then
            pip install -q python-pptx pillow
            python chapter-06/build_pptx.py
          fi
      - name: Commit decoded assets
        run: |
          set -euo pipefail
          git config user.name "qv4rk"
          git config user.email "223748002+qv4rk@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Decode/synthesize chapter-06 binaries (panels, pptx)."
          git push
