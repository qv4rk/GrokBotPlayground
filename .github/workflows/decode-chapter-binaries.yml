name: Decode chapter binaries
on:
  push:
    paths:
      - 'chapter-06/generate_panels.py'
      - 'chapter-06/build_pptx.py'
      - 'chapter-06/panels/MANIFEST.md'
      - 'chapter-10/generate_panels.py'
      - 'chapter-10/build_pptx.py'
      - 'chapter-10/panels/MANIFEST.md'
      - 'chapter-14/generate_panels.py'
      - 'chapter-14/build_pptx.py'
      - 'chapter-14/panels/MANIFEST.md'
      - '.github/workflows/decode-chapter-binaries.yml'
      - '**/*.b64'
      - '**/*.b64.*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode sidecars best-effort
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re, base64, tarfile
          root = Path('.')
          chunks = {}
          for p in root.rglob('*.b64.*'):
              m = re.match(r'^(.*\.b64)\.(\d+)$', p.name)
              if not m: continue
              key = str(p.parent / m.group(1))
              chunks.setdefault(key, []).append((int(m.group(2)), p))
          for key, parts in chunks.items():
              parts.sort()
              data = ''.join(p.read_text().strip() for _, p in parts)
              Path(key).write_text(data)
              for _, p in parts: p.unlink()
              print('reassembled', key, len(data))
          for p in list(root.rglob('*.b64')):
              out = Path(str(p)[:-4])
              out.parent.mkdir(parents=True, exist_ok=True)
              raw = p.read_text().strip()
              try:
                  pad = (-len(raw)) % 4
                  if pad: raw += '=' * pad
                  out.write_bytes(base64.b64decode(raw))
                  print('decoded', out, out.stat().st_size)
                  p.unlink()
              except Exception as e:
                  print('skip', p, e)
                  p.unlink(missing_ok=True)
                  out.unlink(missing_ok=True)
          for tar_path in list(root.rglob('_fix3.tar')) + list(root.rglob('panels_bundle.tar')):
              try:
                  print('extract', tar_path, tar_path.stat().st_size)
                  with tarfile.open(tar_path, 'r') as tf:
                      tf.extractall(path=tar_path.parent)
                  tar_path.unlink(missing_ok=True)
              except Exception as e:
                  print('skip tar', tar_path, e)
                  tar_path.unlink(missing_ok=True)
          PY
      - name: Generate panels
        run: |
          pip install -q pillow
          if [ -f chapter-06/generate_panels.py ]; then python chapter-06/generate_panels.py; fi
          if [ -f chapter-10/generate_panels.py ]; then python chapter-10/generate_panels.py; fi
          if [ -f chapter-14/generate_panels.py ]; then python chapter-14/generate_panels.py; fi
      - name: Build pptx
        run: |
          pip install -q python-pptx pillow
          if [ -f chapter-06/build_pptx.py ]; then python chapter-06/build_pptx.py; fi
          if [ -f chapter-10/build_pptx.py ]; then python chapter-10/build_pptx.py; fi
          if [ -f chapter-14/build_pptx.py ]; then python chapter-14/build_pptx.py; fi
      - name: Cleanup and commit
        run: |
          set -euo pipefail
          git config user.name "qv4rk"
          git config user.email "223748002+qv4rk@users.noreply.github.com"
          rm -f chapter-06/.bin-probe.txt chapter-06/.latin1-probe.bin chapter-06/.tiny-probe.jpg chapter-06/.tiny-probe2.jpg
          rm -f index.html.b64 book/index.html.b64 chapter-06/index.html.b64 chapter-10/index.html.b64 chapter-14/index.html.b64
          rm -f chapter-06/panels/*.b64 chapter-06/panels/*.b64.* chapter-10/panels/*.b64 chapter-10/panels/*.b64.* chapter-14/panels/*.b64 chapter-14/panels/*.b64.*
          rm -f chapter-06/panels/_fix3.tar chapter-10/panels/panels_bundle.tar chapter-14/panels/panels_bundle.tar
          git add -A
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m "A: decode chapter binaries + panels/pptx (Actions)."
          git pull --rebase origin main
          git push
